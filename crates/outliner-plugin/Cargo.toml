[package]
name = "outliner-plugin"
description = "Outliner: outline inlined MLIL patterns into calls (Binary Ninja plugin)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "outliner"
crate-type = ["cdylib"]

[dependencies]
outliner-core = { path = "../outliner-core" }
binaryninjacore-sys = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "f2ccaade1621c0eaf7c8410161fd375f3f1642cc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
